name: Studio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: python -m pip install 'reportlab==4.4.3' 'PyMuPDF==1.26.4' 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - run: make check test build pdf-check
      - run: python tests/browser_smoke.py --binary bin/bolty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
